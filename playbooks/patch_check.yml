- hosts: webservers
  become: yes

  tasks:
    - name: Verificar uptime
      command: uptime
      register: uptime_output

    - name: Verificar pacotes atualizáveis
      command: apt list --upgradable
      register: updates
      changed_when: false

    - name: Verificar se precisa reboot
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Falhar se ainda houver updates
      fail:
        msg: "Ainda existem pacotes pendentes!"
      when: updates.stdout_lines | length > 1

    - name: Mostrar resultados
      debug:
        msg:
          - "Uptime: {{ uptime_output.stdout }}"
          - "Updates pendentes: {{ updates.stdout_lines | length }}"
          - "Reboot necessário: {{ reboot_required.stat.exists }}"
